name: ProofRail mainnet indexer

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: proofrail-mainnet-indexer
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  index:
    name: Index confirmed BOT receipts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BOT_CHAIN_ID: "677"
      BOT_RPC_URL: https://rpc.botchain.ai
      EVIDENCE_REGISTRY_ADDRESS: "0x2Cd561589678F5CB161d2209a323e42B09C44B70"
      REGISTRY_DEPLOYMENT_BLOCK: "20181317"
      INDEXER_CONFIRMATIONS: "12"
      INDEXER_BATCH_SIZE: "2000"
      INDEXER_POLL_INTERVAL_MS: "3000"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Build indexer
        run: corepack pnpm --filter @proofrail/indexer build

      - name: Run indexer until the next scheduled invocation
        run: timeout --preserve-status --signal=TERM 240s corepack pnpm --filter @proofrail/indexer start
