services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: proofrail_test
      POSTGRES_PASSWORD: proofrail_test
      POSTGRES_USER: proofrail
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username proofrail --dbname proofrail_test"]
      interval: 1s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
